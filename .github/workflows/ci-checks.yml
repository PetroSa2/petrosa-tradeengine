---
name: CI Checks

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  release:
    types: [published]

jobs:
  pipeline:
    name: CI Pipeline
    uses: PetroSa2/petrosa-shared-workflows/.github/workflows/ci-pipeline.yml@ac55a0ad451d63a6973d6228deebb5651814ca98  # yamllint disable-line rule:line-length
    with:
      service-name: 'tradeengine'
      image-name: 'yurisa2/petrosa-tradeengine'
      python-version: '3.11'
      skip-docker-build: true
      # Explicit per-repo floor (petrosa_k8s#1052 epic step 5 / #575). Measured
      # coverage is 75% (quality-baseline-2026-09.md §1), far above the
      # shared-workflow default of 40 — per the socket-client precedent
      # (petrosa-socket-client#136 / PR #140), pin the canonical Golden
      # Standard floor of 40 explicitly instead of a narrower ratchet.
      coverage-threshold: '40'
      pytest-extra-args: >-  # yamllint disable-line rule:line-length
        --ignore=tests/test_api.py
        --ignore=tests/test_api_config_routes_comprehensive.py
        --ignore=tests/test_api_config_validation.py
        --ignore=tests/test_api_filter_routes.py
        --ignore=tests/test_cio_state.py
        --ignore=tests/test_trading_config_rollback.py
        --ignore=tests/test_span_attributes.py
    secrets: inherit
